name: Astro Preview

on:
  pull_request:
    paths:
      - "astro-starlight/**"
      - ".github/workflows/astro-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astro-starlight/package-lock.json

      - name: Install dependencies
        working-directory: astro-starlight
        run: npm ci

      - name: Build
        working-directory: astro-starlight
        run: npm run build

      - name: Verify base path output
        run: |
          test -f astro-starlight/dist/index.html
          grep -q '/jacdac-docs/' astro-starlight/dist/index.html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-starlight-dist
          path: astro-starlight/dist
          if-no-files-found: error
